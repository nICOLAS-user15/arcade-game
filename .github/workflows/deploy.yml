name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Nothing by default; each job asks only for what it needs
permissions: {}

# A deploy that has started is allowed to finish; the next one waits in the queue
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Runs the repository's own code (tests, build script) with read-only access
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Actions are pinned to a full commit SHA (a tag can be moved; a SHA cannot). Dependabot keeps them updated.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  # Holds the publishing rights, but runs none of the repository's code: it only publishes the artifact
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
